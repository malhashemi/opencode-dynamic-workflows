# Releases are driven by release-please: conventional commits on main keep a release PR up to
# date (version bump + CHANGELOG). Merging that PR creates the GitHub release, and the publish
# job builds the TUI bundle and the web app and publishes the package to npm with provenance
# (trusted publishing: OIDC, no tokens).
#
# To finish a release that failed part-way, run this workflow manually with the tag: it
# publishes that tag if it is not on npm yet.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      # The package lives in packages/plugin, so release-please prefixes its outputs with that path.
      created: ${{ steps.release.outputs['packages/plugin--release_created'] }}
      tag: ${{ steps.release.outputs['packages/plugin--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A pull request opened with the workflow token gets its CI run held for approval, and main
      # requires those checks. Approve the release pull request's own run: a separately started
      # run is not linked to the pull request, so its checks would not count.
      - name: Approve CI on the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          branch=$(printf '%s' "${PRS:-[]}" | jq -r '.[0].headBranchName // empty')
          if [ -z "$branch" ]; then
            echo "No release pull request was opened or updated"
            exit 0
          fi
          # Only the run for the branch's current head: older runs on the same branch are stale.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" -q .object.sha)
          for attempt in $(seq 1 24); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$branch" --event pull_request \
              --status action_required --limit 20 --json databaseId,headSha \
              -q "[.[] | select(.headSha == \"$sha\")][0].databaseId // empty")
            if [ -n "$run" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve"
              echo "Approved CI run $run for $branch at $sha"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::No CI run for $branch at $sha waits for approval; approve it in the Actions tab"

  plan:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          CREATED: ${{ needs.release-please.outputs.created }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null
          elif [ "$CREATED" = "true" ]; then
            tag="$CREATED_TAG"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "publish=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing (OIDC, no tokens) and provenance.
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # The TUI bundle and the web app ship inside the package (dist/ is not committed).
      - run: bun run build

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never restore caches into a release build.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - name: Publish the plugin
        working-directory: packages/plugin
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already published"
          else
            npm publish --provenance --access public
          fi
